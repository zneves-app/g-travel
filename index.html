<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style><title>G-Travel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a4f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G-Travel">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma tela; cabeçalho azul, conteúdo rolável, barra inferior com 4 abas. Azul = estrutura, laranja = destaque */
:root{
  --brand:#1a4f8b; --brand-ink:#ffffff; --accent:#ec6f35; --accent-ink:#ffffff;
  --soft:#fde0cf; --brand-text:#1a4f8b; --accent-text:#b84f1c;
  --bg:#eef2f7; --card:#ffffff; --fg:#18212d; --muted:#5f6b7a; --line:#e2e7ef;
  --sun:#d84315; --shadow:0 1px 3px rgba(16,36,64,.08);
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#16365c; --brand-ink:#eaf2ff; --accent:#f58d5c; --accent-ink:#1b1206;
  --soft:#4a2c22; --brand-text:#8fbcf0; --accent-text:#f0a68a;
  --bg:#0f141b; --card:#19212c; --fg:#e6ebf2; --muted:#9aa6b6; --line:#28323f;
  --sun:#ff8a65; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#16365c; --brand-ink:#eaf2ff; --accent:#f58d5c; --accent-ink:#1b1206;
  --soft:#4a2c22; --brand-text:#8fbcf0; --accent-text:#f0a68a;
  --bg:#0f141b; --card:#19212c; --fg:#e6ebf2; --muted:#9aa6b6; --line:#28323f;
  --sun:#ff8a65; --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  display:flex;flex-direction:column;gap:8px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .r1,header.top .r2{display:flex;align-items:center;gap:10px;min-height:36px}
header.top img{width:30px;height:30px;border-radius:8px;flex:none}
header.top .brand{font-size:18px;font-weight:700;flex:1;min-width:0;letter-spacing:.01em}
.flags{display:flex;gap:4px;flex:none}
.flag{border:2px solid transparent;background:transparent;border-radius:8px;width:38px;height:32px;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;opacity:.6}
.flag[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,255,255,.14);opacity:1}
header.top h1{font-size:20px;font-weight:500;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:6px;flex:none}
.pill{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font:500 14px var(--f-body);cursor:pointer;white-space:nowrap}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px}
.wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cal{background:var(--card);border-radius:0 0 22px 22px;padding:8px 6px 14px;box-shadow:var(--shadow)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 10px}
.cal-nav h2{font-size:22px;font-weight:500;margin:0}
.navbtn{width:40px;height:40px;border:0;background:transparent;color:var(--fg);font-size:26px;border-radius:50%;cursor:pointer}
.navbtn:disabled{opacity:.25}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:6px}
.dow{text-align:center;color:var(--muted);font-size:13px;padding-bottom:6px;text-transform:capitalize}
.dow.s{color:var(--sun)}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:74px;padding-top:4px;border:0;background:transparent;color:var(--fg);cursor:default;border-radius:12px}
.cell.has{cursor:pointer}
.cell.has:active{background:var(--bg)}
.cell .n{width:32px;height:32px;display:grid;place-items:center;font-size:16px;border-radius:50%}
.cell.sun .n{color:var(--sun)}
.cell.out{opacity:.35}
.cell.today .n{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip{font:700 10.5px/1 var(--f-body);color:#fff;border-radius:4px;padding:4px;letter-spacing:.02em;max-width:100%;white-space:nowrap;overflow:hidden}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.sum{margin-top:12px;padding:16px 18px}
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lbl{color:var(--muted);font-size:14px}
.big{font-size:26px;font-weight:700;color:var(--brand-text);font-variant-numeric:tabular-nums}
.right{text-align:right}
.right b{font-size:17px;display:block}
.rows{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%}
.cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.val{font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.countdown{margin-top:12px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.countdown .num{font:700 30px var(--f-body);color:var(--accent-text);min-width:44px;text-align:center}

.sec{font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:18px 8px 8px}
.list{overflow:hidden}
.item,.day-row{display:flex;gap:14px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;color:var(--fg);cursor:pointer}
.item:last-child,.day-row:last-child{border-bottom:0}
.badge{width:44px;height:44px;border-radius:11px;color:#fff;display:grid;place-items:center;font:700 12px var(--f-body);flex:none}
.item .t{font-size:17px;font-weight:500}
.s{color:var(--muted);font-size:14px;margin-top:2px}
.mid{min-width:0;flex:1}
.day-row .d{width:44px;text-align:center;flex:none}
.day-row .d b{display:block;font-size:20px}
.day-row .d small{color:var(--muted);font-size:12px;text-transform:uppercase}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;font-size:11.5px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .ic{width:44px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab svg{width:22px;height:22px;fill:currentColor}
.tab[aria-selected="true"]{color:var(--accent-text);font-weight:700}
.tab[aria-selected="true"] .ic{background:var(--soft)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.sheet-h{color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet-h .bar{display:flex;align-items:center;gap:4px}
.sheet-h .bar .sp{flex:1}
.sheet-h .navbtn{color:#fff}
.sheet-h .date{font-size:14px;opacity:.92;padding:4px 8px 0}
.sheet-h h2{font-size:24px;font-weight:500;margin:4px 8px 0;text-wrap:balance}
.sheet-h .where{font-size:14px;opacity:.92;padding:6px 8px 0}
.sheet-b{flex:1;overflow-y:auto;padding-block:12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.box{padding:14px 16px}
.box h3{font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:center;gap:6px;padding:4px 0}
.leg .p{font-size:16px;font-weight:500}
.leg .h{font:500 20px var(--f-num)}
.leg .mode{text-align:center;color:var(--accent-text)}
.leg .mode svg{width:24px;height:24px;fill:currentColor}
.leg .r{text-align:right}
.leg-note{color:var(--muted);font-size:13px;grid-column:1/-1}
.tl .e{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);line-height:1.4}
.tl .e:last-child{border-bottom:0}
.tl .tm{font:500 13px var(--f-num);color:var(--brand-text);padding-top:2px}
.tl .e.np{grid-template-columns:minmax(0,1fr)}
.orig{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px;margin-bottom:6px}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .x{display:flex;justify-content:space-between;gap:12px}
.exp .x span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.hotel{font-size:16px;font-weight:500}
.muted{color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.bar-r .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.bar-r .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-r .fl{height:100%;border-radius:4px}

.trip{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.pick{flex:1;min-width:0;display:flex;gap:14px;align-items:center;padding:12px 16px;border:0;background:transparent;color:var(--fg);text-align:left;cursor:pointer}
.pick .mid{display:flex;flex-direction:column}
.pick .t{font-size:16px;font-weight:500}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.trip.on .radio{border:6px solid var(--accent)}
.del{border:0;background:transparent;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:15px;white-space:nowrap}
.del.armed{color:var(--sun);font-weight:700}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.lnk{color:var(--brand-text)}
a.btn{text-decoration:none}
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:6px}
.alb{border:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:0 0 12px;text-align:left;color:var(--fg);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.alb .cover{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:8px;overflow:hidden}
.alb .cover img{width:100%;height:100%;object-fit:cover;display:block}
.alb .an,.alb .s{padding:0 12px}
.alb .an{font-size:16px;font-weight:500}
.ph-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-top:10px}
.ph{border:0;padding:0;aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:6px;cursor:pointer;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.empty{display:flex;gap:14px;align-items:center;margin-top:12px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:25;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar,.vnav{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.vbar .sp{flex:1;text-align:center;font-size:14px;opacity:.8}
.viewer .navbtn{color:#fff;font-size:22px;width:auto;min-width:44px;border-radius:999px}
.viewer .armed{background:#c62828;font-size:15px;padding:0 14px}
.vimg{flex:1;min-height:0;display:grid;place-items:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vnav{justify-content:space-between}
.vdate{font-size:14px;opacity:.8}
.selbar{display:flex;justify-content:space-between;align-items:center;padding-top:12px;gap:8px}
.pill.dark{color:var(--brand-text);border-color:var(--line)}
.ph{position:relative}
.ph .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid #fff;color:transparent;display:grid;place-items:center;font-size:14px;font-weight:700}
.ph.sel .tick{background:var(--accent);color:#fff}
.ph.sel img{opacity:.75}
.igbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;padding:0 16px}
.btn.ig{background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:26;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.mbox{width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.mt{margin:0;font-size:18px;display:flex;gap:8px;align-items:center}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);color:var(--fg);cursor:pointer}
.opt:disabled{opacity:.5;cursor:default}
.opt b{font-size:16px}
.small{font-size:13px}
.pill.icon{padding:4px 9px}
.inv{border:0;background:transparent;padding:10px 6px;cursor:pointer;font-size:17px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.linkbox{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:13px var(--f-num);background:var(--bg);color:var(--fg);resize:none}
.howto{font-size:14px;line-height:1.5}
.welcome{align-items:stretch;text-align:left}
.wicon{width:56px;height:56px;border-radius:14px}
.inv-head{display:flex;gap:14px;align-items:center}
.inv-ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.inv-ic svg{width:28px;height:28px;fill:currentColor}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px;font-size:15px;cursor:pointer;text-align:left}
.lang[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font:500 15px var(--f-body);cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand-text);border:1.5px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.msg{font-size:14px;padding:8px 0 0}
.msg.err{color:var(--sun)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>

/* ---------- dados ---------- */
const ORIGINAL=JSON.parse(document.getElementById('trip-data').textContent);ORIGINAL.id='original';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function validTrip(t){return t&&Array.isArray(t.days)&&t.days.length&&t.cities&&t.days.every(d=>d.date&&t.cities[d.city])}
/* roteiros adicionados pela pessoa ficam guardados neste aparelho */
let SAVED=[];try{SAVED=(JSON.parse(store.get('gtravel-trips')||'[]')||[]).filter(validTrip)}catch(e){}
const allTrips=()=>[ORIGINAL,...SAVED];
function saveTrips(){store.set('gtravel-trips',JSON.stringify(SAVED))}
let TRIP=allTrips().find(t=>t.id===store.get('gtravel-current'))||ORIGINAL;
let DAYS,CITIES,byDate;
function setTrip(t){TRIP=t;DAYS=t.days;CITIES=t.cities;byDate=Object.fromEntries(DAYS.map((d,i)=>[d.date,i]));store.set('gtravel-current',t.id||'original')}
setTrip(TRIP);

function xDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  if(v instanceof Date)return iso(v.getFullYear(),v.getMonth(),v.getDate());
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?2000+ +m[3]:+m[3];return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  return 'bad';
}
function xTime(v){

  if(typeof v==='number'){const t=Math.round((v%1)*1440);return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`}
  const m=String(v).trim().match(/^(\d{1,2})\s*[:h]\s*(\d{2})?/i);return m?`${pad(+m[1])}:${m[2]||'00'}`:String(v).trim();
}

function readSheet(wb,key){

  return {name,head,rows:rows.slice(1).map((r,i)=>({r,line:i+2})).filter(x=>x.r.some(c=>c!=null&&String(c).trim()!==''))};
}

const i18nName=(db,n,src,i0)=>{const e=db[norm(n)];if(!e)return String(n).trim();const o={pt:String(n).trim(),en:e[i0],es:e[i0+1],zh:e[i0+2]};o[src]=String(n).trim();return o};
function workbookToTrip(wb,srcLang){
  const dias=readSheet(wb,'dia');if(!dias||!dias.rows.length)throw new SheetError('noDays');
  const cD=col(dias,'data'),cC=col(dias,'cidade'),cP=col(dias,'pais'),cT=col(dias,'titulo'),cH=col(dias,'hotel'),cV=col(dias,'valor');
  const LX=['en','es','zh'],tCols=sh=>Object.fromEntries(LX.map(k=>[k,sh.head.findIndex(h=>h.endsWith('('+k+')'))]).filter(([,i])=>i>=0));const dT=tCols(dias);
  if(cD<0||cC<0)throw new SheetError('noCols',dias.name);
  const cities={},byName={},days=[],seen={};
  const cityKey=name=>{
    const n=norm(name);
    if(!n||/^(voo|em voo|aviao|flight|vuelo)$/.test(n)){if(!cities.VOO)cities.VOO={code:'VOO',name:{pt:'Em voo',en:'In flight',es:'En vuelo',zh:'飞行中'},country:null,color:'#78909c'};return 'VOO'}
    if(byName[n])return byName[n];
    let code=CITY_DB[n]?.[0]||n.replace(/[^a-z]/g,'').slice(0,3).toUpperCase()||'CID',k=code,i=2;while(cities[k])k=code.slice(0,2)+i++;
    cities[k]={code:k,name:i18nName(CITY_DB,name,srcLang,1),country:null,color:PALETTE[Object.keys(cities).filter(x=>x!=='VOO').length%PALETTE.length]};
    byName[n]=k;return k;
  };
  for(const {r,line} of dias.rows){
    const date=xDate(r[cD]);if(!date||date==='bad')throw new SheetError('badDate',dias.name,line);
    if(seen[date])throw new SheetError('dupDate',dias.name,line);seen[date]=1;
    const k=cityKey(r[cC]);if(cP>=0&&r[cP]&&k!=='VOO')cities[k].country=i18nName(COUNTRY_DB,r[cP],srcLang,0);
    if(k!=='VOO'&&!cities[k].country)cities[k].country='';
    days.push({date,city:k,title:{[srcLang]:cT>=0&&r[cT]?String(r[cT]).trim():(k==='VOO'?'✈':(typeof cities[k].name==='string'?cities[k].name:cities[k].name[srcLang]))},legs:[],text:{[srcLang]:''},
      hotel:cH>=0&&r[cH]?String(r[cH]).trim():null,hotelCost:cV>=0?xNum(r[cV]):0,tickets:0,expenses:[]});
    for(const[k,i]of Object.entries(dT))if(r[i])days[days.length-1].title[k]=String(r[i]).trim();
  }
  days.sort((a,b)=>a.date<b.date?-1:1);
  const idx=Object.fromEntries(days.map((d,i)=>[d.date,i]));
  const dayOf=(sh,line,v)=>{const d=xDate(v);if(!d||d==='bad')throw new SheetError('badDate',sh.name,line);if(idx[d]===undefined)throw new SheetError('noDay',sh.name,line);return days[idx[d]]};
  const pr=readSheet(wb,'program');
  if(pr){const a=col(pr,'data'),h=col(pr,'hora'),t=col(pr,'ativ','descr'),pT=tCols(pr);
    for(const {r,line} of pr.rows){if(t<0||!r[t])continue;const d=dayOf(pr,line,r[a]),tm=h>=0?xTime(r[h]):null,pre=tm?tm+' ':'';
      d.text[srcLang]+=(d.text[srcLang]?'\n':'')+pre+String(r[t]).trim();
      for(const[k,i]of Object.entries(pT)){if(k===srcLang)continue;const v=r[i]?String(r[i]).trim():String(r[t]).trim();d.text[k]=(d.text[k]?d.text[k]+'\n':'')+pre+v}}}
  const ds=readSheet(wb,'desloc');
  if(ds){const a=col(ds,'data'),f=col(ds,'saida de','de','origem'),hs=col(ds,'horario de saida','saida'),to=col(ds,'chegada em','para','destino'),hc=col(ds,'horario de chegada','chegada'),m=col(ds,'transp'),v=col(ds,'valor'),o=col(ds,'obs');
    for(const {r,line} of ds.rows){const d=dayOf(ds,line,r[a]),mode=norm(m>=0?r[m]:'');
      const leg={from:f>=0&&r[f]?String(r[f]).trim():'',dep:hs>=0?xTime(r[hs]):null,to:to>=0&&r[to]?String(r[to]).trim():'',arr:hc>=0?xTime(r[hc]):null,
        mode:/avi|voo|plane|fli/.test(mode)?'aviao':/trem|train|tren/.test(mode)?'trem':/onib|bus|carro|car/.test(mode)?'onibus':null};
      if(o>=0&&r[o])leg.note=String(r[o]).trim();d.legs.push(leg);if(v>=0)d.tickets+=xNum(r[v])}}
  const gs=readSheet(wb,'gasto');
  if(gs){const a=col(gs,'data'),ds2=col(gs,'descr','item'),v=col(gs,'valor');
    for(const {r,line} of gs.rows){const val=v>=0?xNum(r[v]):0;if(!val)continue;dayOf(gs,line,r[a]).expenses.push([ds2>=0&&r[ds2]?String(r[ds2]).trim():'—',val])}}
  const vg=readSheet(wb,'viag'),info={};
  if(vg)vg.rows.forEach(({r})=>info[norm(r[0])]=r[1]);
  const pick=k=>{const e=Object.entries(info).find(([n])=>n.startsWith(k));return e&&e[1]!=null?String(e[1]).trim():''};
  const cur=(pick('moeda')||'BRL').toUpperCase().slice(0,3);
  return {app:'G-Travel',id:'t'+Date.now(),trip:pick('nome')||cities[days.find(d=>d.city!=='VOO')?.city]?.name||'Roteiro',traveler:pick('viajante'),
    currency:/^[A-Z]{3}$/.test(cur)?cur:'BRL',sourceLanguage:srcLang,cities,days};
}
async function importFile(file){
  if(/\.json$/i.test(file.name)){const t=JSON.parse(await file.text());if(!validTrip(t))throw new SheetError('badFile');t.id='t'+Date.now();return t}
  const X=await loadXlsx().catch(()=>{throw new SheetError('noLib')});
  const wb=X.read(await file.arrayBuffer(),{type:'array'});
  return workbookToTrip(wb,lang);
}

const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBlock(){
  if(isStandalone())return `<div class="muted small">✓ ${T().installed}</div>`;
  if(!isHosted())return `<div class="muted small">${T().installFromSite} <b>${esc(SITE_URL)}</b></div>`;
  return `<button class="btn inst-btn" ${installEvt?'':'hidden'}>📲 ${T().installNow}</button>
   <div class="howto">${isIOS()?T().howIOS:T().howAndroid}</div>`;
}
function wireInstall(root){root.querySelectorAll('.inst-btn').forEach(b=>b.onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;b.hidden=true})}
async function addInvited(t,key){
  t.id=key;const i=SAVED.findIndex(x=>x.id===key);if(i>=0)SAVED[i]=t;else SAVED.push(t);saveTrips();setTrip(t);resetMonth();
}

async function pasteInvite(v){const m=String(v).match(/#?convite=([A-Za-z0-9_-]+)/);if(!m)throw new Error('bad');const t=await unpackTrip(m[1]);await addInvited(t,await tripKey(m[1]))}
function renderGas(){
  const c={tickets:0,lodging:0,food:0,tours:0,local:0,other:0};
  DAYS.forEach(d=>{c.tickets+=d.tickets||0;c.lodging+=d.hotelCost||0;(d.expenses||[]).forEach(e=>c[catOf(e[0])]+=e[1])});
  const tot=Object.values(c).reduce((a,b)=>a+b,0),max=Math.max(...Object.values(c))||1;
  const cols=['#1a4f8b','#ec6f35','#1e88e5','#ecb39c','#5c8fc7','#9aa6b6'];
  const per={};DAYS.forEach((d,i)=>{if(!CITIES[d.city].country)return;(per[d.city]=per[d.city]||{i,n:0,v:0});per[d.city].n++;per[d.city].v+=dayTotal(d)});
  $('#main').innerHTML=`<div class="wrap"><div class="card sum"><div class="sum-top"><div><div class="lbl">${T().totalTrip}</div><div class="big">${money(tot)}</div></div><div class="right"><b>${T().days(DAYS.length)}</b><span class="lbl">${money(tot/DAYS.length,0)}${T().perDay}</span></div></div>
   <div class="bars">${Object.entries(c).map(([k,v],i)=>`<div class="bar-r"><div class="top"><span>${T().cat[k]}</span><span class="val">${money(v,0)}</span></div><div class="tr"><div class="fl" style="width:${v/max*100}%;background:${cols[i]}"></div></div></div>`).join('')}</div></div>
   <div class="sec">${T().byCity}</div><div class="card list">${Object.entries(per).filter(([k,x])=>x.v>0).map(([k,x])=>`<button class="item" data-i="${x.i}"><span class="badge" style="background:${CITIES[k].color}">${esc(CITIES[k].code)}</span><div class="mid"><div class="t">${esc(cityName(k))}</div><div class="s">${T().days(x.n)}</div></div><span class="val">${money(x.v,0)}</span></button>`).join('')}</div>
   <p class="muted" style="padding:12px 8px">${T().costsNote}</p></div>`;
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openDay(+b.dataset.i));
}
function renderCfg(){
  const tpl='modelo-g-travel.xlsx';
  const tripRow=t=>{const f=t.days[0].date,l=t.days[t.days.length-1].date,on=t===TRIP;
    return `<div class="trip ${on?'on':''}"><button class="pick" data-id="${esc(t.id)}" aria-pressed="${on}"><span class="radio"></span><span class="mid"><span class="t">${esc(tx(t.trip))}</span>
    <span class="s">${t.traveler?esc(t.traveler)+' · ':''}${shortDate(f)} ${T().to} ${shortDate(l)} · ${T().days(t.days.length)}</span></span></button>
    <button class="inv" data-inv="${esc(t.id)}" aria-label="${T().invite}">✉️</button>
    ${t.id!=='original'?`<button class="del" data-del="${esc(t.id)}" aria-label="${T().remove}">✕</button>`:''}</div>`};
  $('#main').innerHTML=`<div class="wrap">
   <div class="sec">${T().myTrips}</div>
   <div class="card list">${allTrips().map(tripRow).join('')}</div>
   <div class="sec">${T().joinTitle}</div>
   <div class="card box stack"><div class="muted small">${T().joinHow}</div>
     <input id="pinv" class="linkbox" placeholder="https://…#convite=…" autocomplete="off"><button class="btn ghost" id="bpinv">${T().joinBtn}</button><div class="msg" id="jmsg" role="status"></div></div>
   <div class="sec">${T().installTitle}</div>
   <div class="card box stack" id="instbox">${installBlock()}</div>
   <div class="sec">${T().newTrip}</div>
   <div class="card box stack">
     <ol class="steps"><li>${T().step1}</li><li>${T().step2}</li><li>${T().step3}</li></ol>
     ${tpl?`<a class="btn ghost" href="${tpl}" download>⬇ ${T().download}</a>`:TPL_B64?`<button class="btn ghost" id="dl" hidden>⬇ ${T().download}</button><div class="muted" id="nodl">${T().noDownload}</div>`:`<div class="muted">${T().noDownload}</div>`}
     <label class="btn" for="file">⬆ ${T().upload}</label><input id="file" type="file" accept=".xlsx,.xls,.json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
     <div class="msg" id="msg" role="status"></div>
   </div></div>`;
  const dl=$('#dl');if(dl&&window.claude?.use)window.claude.use('downloads').then(d=>{if(!d||!document.body.contains(dl))return;dl.hidden=false;$('#nodl').hidden=true;
    dl.onclick=()=>{const bin=atob(TPL_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      d.save({filename:'modelo-g-travel.xlsx',data:new Blob([u])}).catch(()=>{})}}).catch(()=>{});
  wireInstall($('#main'));
  document.querySelectorAll('.inv').forEach(b=>b.onclick=()=>{const t=allTrips().find(x=>x.id===b.dataset.inv);if(t)inviteSheet(t)});
  $('#bpinv').onclick=async()=>{const m=$('#jmsg');try{await pasteInvite($('#pinv').value);st.tab='cal';st.view='month';save();render()}catch(e){m.className='msg err';m.textContent=T().badInvite}};
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const t=allTrips().find(x=>x.id===b.dataset.id);if(t){setTrip(t);resetMonth();renderCfg()}});
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){SAVED=SAVED.filter(t=>t.id!==b.dataset.del);saveTrips();if(TRIP.id===b.dataset.del){setTrip(ORIGINAL);resetMonth()}renderCfg();return}
    b.dataset.armed=1;b.textContent=T().confirmDel;b.classList.add('armed')});
  $('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const msg=$('#msg');msg.className='msg';msg.textContent=T().reading;
    try{const t=await importFile(file);SAVED.push(t);saveTrips();setTrip(t);resetMonth();st.tab='cal';st.view='month';save();render()}
    catch(err){msg.className='msg err';msg.textContent=err instanceof SheetError&&T().err[err.key]?T().err[err.key](...err.args):T().err.badFile()}
    e.target.value=''};
}
function timeline(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    let m=l.match(/^(\d{1,2}[:h]\d{2}(?:\s*[–-]\s*\d{1,2}[:h]\d{2})?)(?:\s*em diante)?\s*[-–:\t ]\s*(.+)$/);
    if(m)return `<div class="e"><span class="tm">${m[1].replace(/h/g,':').replace(/\s/g,'')}</span><span>${esc(m[2].replace(/^[-–]\s*/,''))}</span></div>`;
    m=l.match(/^(Manh[ãa]|Tarde|Noite|Jantar|Almoço|Dia|Depois do jantar|Morning|Afternoon|Evening|Night|Dinner|Lunch|Mañana|Noche|Cena|Almuerzo|上午|下午|晚上|晚餐|午餐)[^:：]{0,22}[:：]\s*(.+)$/i);
    if(m)return `<div class="e"><span class="tm">${esc(m[1])}</span><span>${esc(m[2])}</span></div>`;
    return `<div class="e np"><span>${esc(l)}</span></div>`;
  }).join('');
}
let cur=null;
function openDay(i){
  cur=i;const d=DAYS[i],c=CITIES[d.city],S=$('#sheet');
  const legs=(d.legs||[]).map(l=>`<div class="leg"><div><div class="h">${esc(l.dep||'')}</div><div class="p">${esc(placeName(l.from))}</div></div><div class="mode">${ICON[l.mode]||''}</div><div class="r"><div class="h">${esc(l.arr||'')}</div><div class="p">${esc(placeName(l.to))}</div></div>${l.note?`<div class="leg-note">${esc(tx(l.note))}</div>`:''}</div>`).join('');
  const ex=[...(d.tickets?[[T().tickets,d.tickets]]:[]),...(d.hotelCost?[[T().lodging,d.hotelCost]]:[]),...(d.expenses||[]).map(e=>[expName(e[0]),e[1]])];
  const txt=d.text&&(d.text[lang]||d.text[TRIP.sourceLanguage||'pt']||''),src=TRIP.sourceLanguage||'pt';
  const origNote=d.text&&!d.text[lang]&&lang!==src?`<div class="orig">${esc(T().original(LANGS[src]?.name||src))}</div>`:'';
  S.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(tx(d.title))}"><div class="sheet-h" style="background:${c.color}">
   <div class="bar"><button class="navbtn" id="sx" aria-label="${T().closeLbl}">✕</button><span class="sp"></span><button class="navbtn" id="sp" aria-label="${T().prevDay}" ${i===0?'disabled':''}>‹</button><button class="navbtn" id="sn" aria-label="${T().nextDay}" ${i===DAYS.length-1?'disabled':''}>›</button></div>
   <div class="date">${esc(longDate(d.date))} · ${T().dayOf(i+1,DAYS.length)}</div>
   <h2>${esc(tx(d.title))}</h2><div class="where">${c.country?esc(T().nightIn(cityName(d.city))):T().nightPlane}</div></div>
   <div class="sheet-b">
   ${legs?`<div class="card box"><h3>${T().travel}</h3>${legs}</div>`:''}
   ${d.hotel?`<div class="card box"><h3>${T().stay}</h3><div class="hotel">${esc(d.hotel)}</div>${d.hotelNote?`<div class="muted">${esc(tx(d.hotelNote))}</div>`:''}</div>`:''}
   ${txt?`<div class="card box"><h3>${T().plan}</h3>${origNote}<div class="tl">${timeline(txt)}</div></div>`:''}
   ${ex.length?`<div class="card box"><h3>${T().dayCosts}</h3><div class="exp">${ex.map(e=>`<div class="x"><span>${esc(e[0])}</span><span>${money(e[1])}</span></div>`).join('')}<div class="x tot"><span>${T().total}</span><span>${money(dayTotal(d))}</span></div></div></div>`:''}
   </div></div>`;
  S.hidden=false;
  $('#sx').onclick=closeDay;$('#sp').onclick=()=>openDay(i-1);$('#sn').onclick=()=>openDay(i+1);
}
function closeDay(){const S=$('#sheet');if(cur===null)return;S.hidden=true;S.innerHTML='';const d=parseD(DAYS[cur].date);cur=null;
  if(st.tab==='cal'&&st.view==='month'){st.y=d.getFullYear();st.m=d.getMonth();render()}}
document.addEventListener('keydown',e=>{if(cur===null)return;if(e.key==='Escape')closeDay();if(e.key==='ArrowRight'&&cur<DAYS.length-1)openDay(cur+1);if(e.key==='ArrowLeft'&&cur>0)openDay(cur-1)});
let tx0=null;document.addEventListener('touchstart',e=>{if(cur!==null)tx0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(cur===null||tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>70){if(dx<0&&cur<DAYS.length-1)openDay(cur+1);if(dx>0&&cur>0)openDay(cur-1)}},{passive:true});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{album=null;selMode=false;selected.clear();st.tab=b.dataset.tab;save();closeDay();render()});
render();
if(/^#convite=/.test(location.hash))openInvite(location.hash.slice(9));
window.addEventListener('hashchange',()=>{if(/^#convite=/.test(location.hash))openInvite(location.hash.slice(9))});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
fetch('roteiro.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(t=>{if(validTrip(t)&&TRIP===ORIGINAL&&JSON.stringify(t)!==JSON.stringify(ORIGINAL)){ORIGINAL_SET(t)}}).catch(()=>{});
function ORIGINAL_SET(t){setTrip(t);resetMonth();render()}
</script>
</body></html>
